  <text x="56" y="126" fill="#fff4e5" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Suzry<tspan fill="#f7aa46">.</tspan></text>
  <text x="59" y="177" fill="#ded7cc" font-family="Arial, Helvetica, sans-serif" font-size="26">Forward Deployed Engineer (FDE)</text>
  <text x="59" y="227" fill="#e8b66f" font-family="monospace" font-size="15" letter-spacing="2">BUILD · REFINE · REPEAT</text>
