<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Suzry</title>
  <desc id="desc">Forward Deployed Engineer (FDE). Midnight blue and warm sunset tones inspired by Suzry's avatar.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060e"/>
      <stop offset=".48" stop-color="#06182d"/>
      <stop offset=".68" stop-color="#293a3c"/>
      <stop offset=".83" stop-color="#b16b26"/>
      <stop offset=".9" stop-color="#f39a22"/>
      <stop offset="1" stop-color="#1c1008"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02060e" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#02060e" stop-opacity=".75"/>
      <stop offset="1" stop-color="#02060e" stop-opacity="0"/>
